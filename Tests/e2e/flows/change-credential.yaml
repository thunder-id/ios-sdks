appId: dev.thunderid.Quickstart
name: Change password from Manage Account
tags:
  - account
env:
  E2E_USERNAME: e2e_mobile_user
  E2E_PASSWORD: TestPassword@123
  # This flow changes E2E_PASSWORD on the shared E2E user through the real server, giving the
  # current password each time, so it changes to this value and back to E2E_PASSWORD before
  # finishing. If it fails between those two changes, the E2E user is left on this password; delete
  # the user, or start a fresh server, so provisioning creates it again with E2E_PASSWORD.
  E2E_TEMP_PASSWORD: TempPassword@456
---
- launchApp:
    clearState: true
- runFlow: subflows/ensure-signed-out.yaml

- runFlow: subflows/sign-in.yaml

- scrollUntilVisible:
    element: "Manage Account"
    direction: DOWN
    timeout: 20000
- tapOn: "Manage Account"

# UserProfile's own field rows render above it, so the row can start off-screen on a small device.
- scrollUntilVisible:
    element: "Change Password"
    direction: DOWN
    timeout: 20000

# Change away from E2E_PASSWORD, then back, so the E2E user's credential is unchanged once this
# flow finishes, matching signin.yaml's "leaves the app as it found it" convention.
- runFlow:
    file: subflows/change-password-to.yaml
    env:
      CURRENT_PASSWORD: ${E2E_PASSWORD}
      NEW_PASSWORD: ${E2E_TEMP_PASSWORD}

# Replacing a password the user holds revokes the user's tokens, so sign in again with the
# temporary password before changing it back.
- tapOn: "Home"
- runFlow: subflows/ensure-signed-out.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      E2E_PASSWORD: ${E2E_TEMP_PASSWORD}

- scrollUntilVisible:
    element: "Manage Account"
    direction: DOWN
    timeout: 20000
- tapOn: "Manage Account"
- scrollUntilVisible:
    element: "Change Password"
    direction: DOWN
    timeout: 20000
- runFlow:
    file: subflows/change-password-to.yaml
    env:
      CURRENT_PASSWORD: ${E2E_TEMP_PASSWORD}
      NEW_PASSWORD: ${E2E_PASSWORD}

- tapOn: "Home"
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
    timeout: 20000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Get started"
    timeout: 20000
