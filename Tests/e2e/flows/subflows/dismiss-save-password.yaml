appId: dev.thunderid.Quickstart
---
# iOS offers to store submitted credentials in the Keychain ("Save Password?") after a password
# field is submitted. It is a system alert drawn over the app, so it swallows the taps and
# assertions that follow a sign-in or sign-up. It is also not guaranteed to appear - whether iOS
# prompts depends on prior AutoFill state - so it has to be dismissed conditionally rather than
# unconditionally waited for.
#
# It does not always appear immediately - iOS can show it a beat after the field commits, more so
# on a loaded CI runner - so a single check right after the submit tap can find nothing yet and
# let the dialog appear afterward, right as the next assertion or tap runs. Polling a few short
# windows instead of checking once covers that race without meaningfully slowing down the common
# case where the dialog never appears at all.
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            visible: "Save Password?"
          commands:
            - tapOn: "Not Now"
      - waitForAnimationToEnd:
          timeout: 750
