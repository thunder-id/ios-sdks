appId: dev.thunderid.Quickstart
---
# Opens the ChangeCredential sheet from the Manage Account screen's "Change Password" row, submits
# NEW_PASSWORD as both the new value and its confirmation, and waits for the sheet to dismiss
# (ChangeCredential's own success behavior - there is no separate on-screen confirmation).
- tapOn: "Change Password"
- extendedWaitUntil:
    visible:
      id: "thunderid-field-newCredential"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    id: "thunderid-field-newCredential"
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: "thunderid-field-confirmCredential"
- inputText: ${NEW_PASSWORD}

- tapOn: "Change"
- runFlow: dismiss-save-password.yaml

# The sheet auto-dismisses on success, so the row's own heading becomes visible again.
- extendedWaitUntil:
    visible: "Change Password"
    timeout: 20000
