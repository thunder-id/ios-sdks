# This workflow will build the project on pull requests with tests
# Uses:
#   OS: macos-latest
#   Swift: swift 5.9+

name: 👷🛠️ PR Builder

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Avoid running multiple PR builders for the same PR on subsequent pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_NAME: "ThunderID"

jobs:
  dependency-review:
    name: 🔎 Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 🔎 Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only,GPL-3.0-or-later,AGPL-3.0-only,AGPL-3.0-or-later
          comment-summary-in-pr: always
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

  lint:
    name: 🧹 Lint Code
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 🔍 Install SwiftLint
        run: brew install swiftlint

      - name: 🔍 Run SwiftLint
        run: swiftlint lint --strict

  build:
    name: 🛠️ Build SDK
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 🗄️ Cache Swift Packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: 🔨 Build SDK
        run: swift build

  test:
    name: 🧪 Run Tests
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 🗄️ Cache Swift Packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: 🧪 Run Tests
        run: swift test -v

  samples-ref:
    name: 🔗 Resolve Samples Ref
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      # A change that breaks the quickstart ships with a samples pull request that fixes it. Name it
      # in this pull request's body as `Samples-Ref: refs/pull/<number>/head` (any branch, tag or
      # commit of thunder-id/samples works), and the sample build and E2E suite fetch that instead
      # of main. The body is untrusted input, so it is read from the environment and the ref is
      # checked against a strict pattern before use.
      - name: 🔗 Resolve Samples Ref
        id: resolve
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ref="$(printf '%s\n' "$PR_BODY" | tr -d '\r' | sed -n 's/^[[:space:]]*Samples-Ref:[[:space:]]*\([^[:space:]]*\)[[:space:]]*$/\1/p' | head -1)"
          if [ -n "$ref" ] && ! printf '%s' "$ref" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$'; then
            echo "::error::Samples-Ref '$ref' is not a valid branch, tag, commit or pull request ref."
            exit 1
          fi
          echo "Samples ref: ${ref:-main}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  build-sample:
    name: 🛠️ Build Quickstart Sample
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    needs: samples-ref
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 🗄️ Cache Swift Packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Tests/e2e/.quickstart/.build
          key: ${{ runner.os }}-swift-sample-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-sample-

      # The sample lives in thunder-id/samples; build it against this checkout so a change that
      # breaks the Quickstart fails here rather than after the release.
      - name: 📥 Fetch Quickstart Sample
        env:
          THUNDERID_SAMPLES_REF: ${{ needs.samples-ref.outputs.ref }}
        run: Tests/e2e/scripts/prepare-sample.sh

      - name: 🔨 Build Quickstart Sample
        working-directory: Tests/e2e/.quickstart
        run: swift build

  build-playground:
    name: 🛠️ Build Playground
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 🗄️ Cache Swift Packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Playground/.build
          key: ${{ runner.os }}-swift-playground-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-playground-

      # The playground depends on the SDK through a local package reference, so this builds it
      # against the sources in this pull request.
      - name: 🔨 Build Playground
        working-directory: Playground
        run: swift build

  e2e:
    name: 🎭 E2E Tests
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    needs: samples-ref
    uses: ./.github/workflows/run-e2e-suite.yml
    with:
      samples-ref: ${{ needs.samples-ref.outputs.ref }}
      # Fork PRs run without repository secrets, so the unauthenticated GitHub API call that
      # resolves "latest" hits its rate limit easily. The nightly workflow already exists to
      # catch breakage from new server releases, so pin the PR builder to a known-good
      # version instead of resolving it live; bump this alongside the server's own releases.
      thunderid-version: "1.0.1"
