# Entrypoint workflow for releasing the iOS SDK.

name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

      confirm_major:
        description: 'Check to confirm intentional major bump (required when bump_type is major)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  RELEASE_GIT_USER_NAME: "thunderid[bot]"
  RELEASE_GIT_USER_EMAIL: "thunderid[bot]@users.noreply.thunderid.dev"

jobs:
  validate:
    name: ✅ Validate Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Guard against accidental major bump
        if: github.event.inputs.bump_type == 'major' && github.event.inputs.confirm_major != 'true'
        run: |
          echo "❌ bump_type is 'major' but confirm_major is not checked. Enable confirm_major to proceed."
          exit 1

  release:
    name: 🍎 Release ThunderID
    needs: [validate]
    if: needs.validate.result == 'success'
    runs-on: macos-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.THUNDERID_AUTOMATION_BOT }}

      - name: 🗄️ Cache Swift Packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: 🔍 Install SwiftLint
        run: brew install swiftlint

      - name: 🔍 Run SwiftLint
        run: swiftlint lint --strict

      - name: 🧪 Run Tests
        run: swift test -v

      - name: 🔨 Build
        run: swift build

      - name: 🏷️ Bump Version
        id: bump
        run: |
          current=$(grep -m1 "s.version" ThunderID.podspec | sed -E "s/.*= '(.*)'/\1/")
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ github.event.inputs.bump_type }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new_version="$major.$minor.$patch"
          sed -i '' "s/s.version          = '$current'/s.version          = '$new_version'/" ThunderID.podspec
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: 📤 Commit, Tag & Push
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          git config user.name "${{ env.RELEASE_GIT_USER_NAME }}"
          git config user.email "${{ env.RELEASE_GIT_USER_EMAIL }}"
          git add ThunderID.podspec
          git diff --cached --quiet || git commit -m "[Release] ThunderID v${{ steps.bump.outputs.version }}"
          for i in $(seq 1 5); do
            git pull --rebase --autostash origin "$RELEASE_REF"
            git push origin HEAD:"$RELEASE_REF" && break
            [ "$i" -eq 5 ] && exit 1
            sleep $((i * 3))
          done
          git tag "${{ steps.bump.outputs.version }}"
          git push origin "${{ steps.bump.outputs.version }}"

      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.THUNDERID_AUTOMATION_BOT }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            --title "ThunderID iOS SDK v${VERSION}" \
            --generate-notes

  package-quickstart:
    name: 📦 Package Quickstart Sample
    needs: [release]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: 📥 Checkout Tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: "${{ needs.release.outputs.version }}"
          persist-credentials: false

      - name: 📦 Extract Quickstart Sample
        run: git archive "${VERSION}" Samples/Quickstart | tar -x -C /tmp

      - name: 🔗 Detach Sample's Package.swift from Local SDK Source
        working-directory: /tmp/Samples/Quickstart
        run: |
          sed -i '' "s#\.package(path: \"../..\")#.package(url: \"https://github.com/thunder-id/ios-sdks\", exact: \"${VERSION}\")#" Package.swift
          grep -q "exact: \"${VERSION}\"" Package.swift
          # Stale — was resolved against the local monorepo package and leaks its dev-only
          # dependencies (e.g. SwiftLint). Removing it forces a fresh resolve against the
          # pinned remote dependency above.
          rm -f Package.resolved

      - name: 💎 Install xcodeproj Gem
        run: gem install xcodeproj --version 1.28.1 --no-document

      - name: 🔗 Detach Sample's Xcode Project from Local SDK Source
        working-directory: /tmp/Samples/Quickstart
        env:
          PACKAGE_URL: https://github.com/thunder-id/ios-sdks
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'Quickstart.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          version = ENV.fetch('VERSION')
          package_url = ENV.fetch('PACKAGE_URL')

          local_ref = project.root_object.package_references.find do |ref|
            ref.is_a?(Xcodeproj::Project::Object::XCLocalSwiftPackageReference)
          end
          raise 'No local Swift package reference found in Quickstart.xcodeproj' unless local_ref

          remote_ref = project.new(Xcodeproj::Project::Object::XCRemoteSwiftPackageReference)
          remote_ref.repositoryURL = package_url
          remote_ref.requirement = {'kind' => 'exactVersion', 'version' => version}

          project.root_object.package_references.delete(local_ref)
          project.root_object.package_references << remote_ref

          project.objects.select { |obj| obj.isa == 'XCSwiftPackageProductDependency' }.each do |dep|
            dep.package = remote_ref if dep.package == local_ref
          end

          project.save
          RUBY

      - name: 🚫 Reject Symlinks
        working-directory: /tmp/Samples/Quickstart
        run: |
          if find . -type l | grep -q .; then
            echo "Symbolic links found in the sample tree — refusing to archive." >&2
            find . -type l -exec echo "  {}" \;
            exit 1
          fi

      - name: 🗜️ Zip Sample
        working-directory: /tmp/Samples
        run: mv Quickstart ios-quickstart && zip -r "ios-quickstart-${VERSION}.zip" ios-quickstart -x "*.xcuserdatad/*"

      - name: 🚀 Upload to Release
        env:
          GH_TOKEN: ${{ secrets.THUNDERID_AUTOMATION_BOT }}
        run: gh release upload "${VERSION}" "/tmp/Samples/ios-quickstart-${VERSION}.zip"
